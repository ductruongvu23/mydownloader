<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>MyDownloader</title>
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      margin: 0;
      background: #18181c;
      color: #e2e8f0;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .title {
      font-size: 15px;
      font-weight: 600;
      color: #38bdf8;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border-radius: 6px;
      background: #27272a;
      border: 1px solid #3f3f46;
      color: #f8fafc;
      font-size: 13px;
    }
    input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      font-size: 13px;
    }
    button {
      width: 100%;
      padding: 9px;
      border-radius: 6px;
      background: #0284c7;
      color: white;
      border: none;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #0369a1;
    }
    .status {
      margin-top: 12px;
      font-size: 12px;
      text-align: center;
      padding: 6px;
      border-radius: 4px;
    }
    .connected {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
    }
    .disconnected {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">MyDownloader Bridge</div>
  </div>

  <div class="toggle">
    <span>Tự động bắt link tải</span>
    <input type="checkbox" id="enabled" checked>
  </div>

  <div class="field">
    <label for="token">Mã Token (lấy trong Cài đặt app):</label>
    <input type="text" id="token" placeholder="Dán Token tại đây">
  </div>

  <div class="field">
    <label for="port">Cổng Bridge Port:</label>
    <input type="number" id="port" value="6801">
  </div>

  <button id="saveBtn">Lưu và Kiểm tra</button>
  <div id="status" class="status disconnected">Chưa kết nối</div>

  <script src="popup.js"></script>
</body>
</html>
