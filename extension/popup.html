<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>MyDownloader Integration</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      background: #121316;
      color: #f1f5f9;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #27272a;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: linear-gradient(135deg, #0ea5e9, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
      color: white;
    }
    .title {
      font-size: 14px;
      font-weight: 600;
      color: #f8fafc;
    }
    .version {
      font-size: 11px;
      color: #64748b;
    }

    .status-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    .status-card.connected {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
    }
    .status-card.disconnected {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #1e1e24;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 22px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #3f3f46;
      transition: .25s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .25s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background: #0284c7;
    }
    input:checked + .slider:before {
      transform: translateX(16px);
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .field {
      margin-bottom: 10px;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      background: #1e1e24;
      border: 1px solid #33333b;
      color: #f8fafc;
      font-size: 12px;
    }
    input:focus {
      outline: none;
      border-color: #38bdf8;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    button {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #0284c7;
      color: white;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
    .btn-secondary {
      background: #27272a;
      color: #cbd5e1;
    }
    .btn-secondary:hover {
      background: #3f3f46;
    }

    .quick-add {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #27272a;
    }
    .hint {
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo-badge">↓</div>
      <div>
        <div class="title">MyDownloader</div>
        <div class="version">Extension v1.1.0</div>
      </div>
    </div>
  </div>

  <div id="statusCard" class="status-card disconnected">
    <div class="status-dot"></div>
    <span id="statusText">Đang kiểm tra kết nối app...</span>
  </div>

  <div class="toggle-row">
    <span>Tự động bắt link tải</span>
    <label class="switch">
      <input type="checkbox" id="enabledInput" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="field">
    <div class="section-title">Cổng kết nối Bridge Port</div>
    <input type="number" id="portInput" value="6801" placeholder="6801">
  </div>

  <div class="btn-group">
    <button id="checkBtn" class="btn-primary">Kiểm tra kết nối lại</button>
  </div>

  <div class="quick-add">
    <div class="section-title">Gửi nhanh liên kết vào app</div>
    <input type="text" id="quickUrl" placeholder="https://... dán link tải vào đây">
    <div style="margin-top: 8px;">
      <button id="quickAddBtn" class="btn-secondary" style="width: 100%;">Tải ngay bằng MyDownloader</button>
    </div>
    <div id="quickMsg" class="hint"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
