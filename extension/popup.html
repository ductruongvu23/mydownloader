<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>MyDownloader Integration</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      padding: 16px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-badge {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: bold;
      color: white;
      box-shadow: 0 2px 8px rgba(14, 165, 233, 0.4);
    }
    .title-wrap {
      display: flex;
      flex-direction: column;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: 0.3px;
    }
    .version {
      font-size: 11px;
      color: #94a3b8;
    }

    /* Tabs */
    .tab-bar {
      display: flex;
      background: rgba(255, 255, 255, 0.04);
      padding: 3px;
      border-radius: 8px;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .tab-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      background: transparent;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      color: #f8fafc;
    }
    .tab-btn.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.35);
    }
    .tab-badge {
      background: rgba(255, 255, 255, 0.25);
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: bold;
    }

    /* Status Card */
    .status-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    .status-card.connected {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
    }
    .status-card.disconnected {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }

    /* Toggle rows */
    .toggle-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 500;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .25s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .25s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background: #0284c7;
    }
    input:checked + .slider:before {
      transform: translateX(16px);
    }

    /* Fields */
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .field {
      margin-bottom: 10px;
    }
    .port-row {
      display: flex;
      gap: 8px;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f8fafc;
      font-size: 12px;
      transition: all 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #38bdf8;
      background: rgba(255, 255, 255, 0.07);
    }

    button {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #0284c7;
      color: white;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
      color: white;
    }

    .quick-add {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .hint {
      font-size: 11px;
      margin-top: 6px;
      line-height: 1.4;
      min-height: 16px;
    }

    /* Tab Media */
    .media-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 2px;
    }
    .media-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all 0.2s;
    }
    .media-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(56, 189, 248, 0.3);
    }
    .media-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .media-title {
      font-size: 12px;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .media-badge {
      font-size: 10px;
      background: rgba(14, 165, 233, 0.2);
      color: #38bdf8;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .media-url {
      font-size: 11px;
      color: #64748b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .media-actions {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    .media-btn {
      flex: 1;
      padding: 6px 8px;
      font-size: 11px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .media-empty {
      text-align: center;
      padding: 30px 10px;
      color: #64748b;
      font-size: 12px;
      line-height: 1.5;
    }
    .media-empty-icon {
      font-size: 28px;
      margin-bottom: 8px;
      display: block;
    }
    .refresh-media-btn {
      width: 100%;
      margin-bottom: 10px;
      padding: 7px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      color: #94a3b8;
      border-radius: 6px;
    }
    .refresh-media-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: white;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="brand">
      <div class="logo-badge">↓</div>
      <div class="title-wrap">
        <div class="title">MyDownloader</div>
        <div id="extVersionText" class="version">Extension v1.0.6</div>
      </div>
    </div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <button id="tabSettingsBtn" class="tab-btn active">
      ⚙️ Cài đặt
    </button>
    <button id="tabMediaBtn" class="tab-btn">
      🎬 Media trên trang
      <span id="tabMediaBadge" class="tab-badge" style="display: none;">0</span>
    </button>
  </div>

  <!-- TAB 1: CÀI ĐẶT & KẾT NỐI -->
  <div id="tabSettingsContent">
    <div id="statusCard" class="status-card disconnected">
      <div class="status-dot"></div>
      <span id="statusText">Đang kiểm tra kết nối app...</span>
    </div>

    <div class="toggle-list">
      <div class="toggle-row">
        <span>Tự động bắt link tải trình duyệt</span>
        <label class="switch">
          <input type="checkbox" id="enabledInput" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="toggle-row">
        <span>Hiện nút tải nổi trên video đang phát</span>
        <label class="switch">
          <input type="checkbox" id="videoBarInput" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="field">
      <div class="section-title">Cổng kết nối Bridge Port</div>
      <div class="port-row">
        <input type="number" id="portInput" value="6801" placeholder="6801" style="width: 100px;">
        <button id="checkBtn" class="btn-primary" style="flex: 1;">Kiểm tra kết nối</button>
      </div>
    </div>

    <div class="quick-add">
      <div class="section-title">Gửi nhanh liên kết vào app</div>
      <input type="text" id="quickUrl" placeholder="https://... dán link tải vào đây">
      <div style="margin-top: 8px;">
        <button id="quickAddBtn" class="btn-secondary" style="width: 100%;">Tải ngay bằng MyDownloader</button>
      </div>
      <div id="quickMsg" class="hint"></div>
    </div>
  </div>

  <!-- TAB 2: MEDIA PHÁT HIỆN TRÊN TAB HIỆN TẠI -->
  <div id="tabMediaContent" style="display: none;">
    <button id="scanMediaBtn" class="refresh-media-btn">🔄 Quét lại video trên trang này</button>
    <div id="mediaListContainer" class="media-list">
      <div class="media-empty">
        <span class="media-empty-icon">🎬</span>
        Chưa phát hiện video hoặc âm thanh nào đang phát trên tab này.<br>Hãy phát video trên trang web rồi mở lại.
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
